pluginManagement {
        repositories {
                maven {
                        name = 'Fabric'
                        url = 'https://maven.fabricmc.net/'
                }
                // Mirror of Maven Central (avoids rate limiting)
                maven {
                        name = 'CentralMirror'
                        url = 'https://maven-central.storage-download.googleapis.com/maven2/'
                }
                mavenCentral()
                gradlePluginPortal()
        }
}

rootProject.name = 'chunker-bedrock-importer'
